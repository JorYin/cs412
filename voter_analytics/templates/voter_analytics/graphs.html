{% extends 'voter_analytics/base.html' %}

{% block content %}
<div class="container">
    <h1>Voter Graphs</h1>
    {% include "voter_analytics/search.html" %}

    <h2>Voters by Year of Birth</h2>
    {{ graph_dob|safe }}

    <h2>Voters by Party Affiliation</h2>
    {{ graph_party|safe }}

    <h2>Election Participation</h2>
    {{ graph_elections|safe }}
</div>
{% endblock %}
