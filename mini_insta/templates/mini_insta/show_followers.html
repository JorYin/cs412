{% extends 'mini_insta/base.html' %}

{% block content %}
  <h1>Followers of @{{ profile.username }}</h1>
  <!-- Loop through each follower and link to that follower's profile page. -->
  {% for follow in profile.get_followers %}
    <p>
      <a href="{% url 'show_profile' follow.follower_profile.pk %}">
        @{{ follow.follower_profile.username }}
      </a>
    </p>
  {% empty %}
    <p>This profile has no followers.</p>
  {% endfor %}
{% endblock %}
