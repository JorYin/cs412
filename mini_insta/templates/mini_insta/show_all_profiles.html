<!-- templates/show_all_profiles.html -->
{% extends 'mini_insta/base.html' %}
<h1>Showing all profiles</h1>

{% block content %}
<main class="grid-container">
    {% for p in profiles %}
      <a href="{% url 'show_profile' p.pk %}">
        <img src="{{p.profile_image_url}}" alt="{{p.profile_image_url}}">
        <p>{{p.username}}</p>
        <p>{{p.display_name}}</p>
      </a>
    {% endfor %}
</main>
{% endblock %}
