Description: Display the account and profile forms used to register a new user. -->

{% extends 'mini_insta/base.html' %}

{% block content %}
<form method='POST'>
  {% csrf_token %}
  <table>
    <!-- Display the account fields needed to create the Django User. -->
    {% for field in user_form %}
      <tr>
        <th>{{ field.label }}</th>
        <td>
          {{ field }}
          {{ field.errors }}
        </td>
      </tr>
    {% endfor %}

    <!-- Display the profile fields that will be linked to the new User. -->
    {% for field in form %}
      <tr>
        <th>{{ field.label }}</th>
        <td>
          {{ field }}
          {{ field.errors }}
        </td>
      </tr>
    {% endfor %}
    <tr>
        <td></td>
        <td>
            <input type="submit" name="create_profile" value="Create">
        </td>
    </tr>
  </table>
</form>
<form action="{% url 'show_all_profiles' %}" method="GET">
    <input type="submit" value="Cancel">
</form>
{% endblock %}
