Description: Display the form used to update an existing post. -->

{% extends 'mini_insta/base.html' %}

{% block content %}
<form method='POST'>
  {% csrf_token %}
  <table>
    <!-- Loop through each editable post field and render its input. -->
    {% for field in form %}
    <tr>
        <th>{{field.name}}</th>
        <td>{{field}}</td>
    </tr>
    {% endfor %}
    <tr>
        <td></td>
        <td>
            <input type='submit' name ='update_post' value= 'Update'>
        </td>
    </tr>
  </table>
</form>
<form action="{% url 'show_post' post.pk %}" method="GET">
  <input type="submit" value="Cancel">
</form>
{% endblock %}
