{% extends 'mini_insta/base.html' %}

{% block content %}
<form method='POST'>
  {% csrf_token %}
  <table>
    {% for field in form %}
    <tr>
        <th>{{field.name}}</th>
        <td>{{field}}</td>
    </tr>
    {% endfor %}
    <tr>
        <td></td>
        <td>
            <input type='submit' name ='update_profile' value= 'Update'>
        </td>
    </tr>
  </table>
</form>
<form action="{% url 'show_profile' profile.pk %}" method='GET' >
    <input type='submit' value="Cancel">
</form>
{% endblock %}
