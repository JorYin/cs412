{% extends 'quotes/base.html' %}
{% block content %}

<div>
  <h2>All quotes by {{quote_person}}</h1>
  <ul>
      {% for quote in all_quotes %}
        <li>{{ quote }}</li>
      {% endfor %}
  </ul>
  <h2> All images of {{quote_person}}</h1>
    <ul>
      {% for item in all_images %}
    <img src="{{item}}" alt="{{quote_person}}">
      {% endfor %}
    </ul>
</div>

{% endblock %}
